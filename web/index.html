<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project">

  <!-- Cache control for Telegram Mini App -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application_1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Royal Door</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Agora Web SDK -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <script>
    // Debug logging for Telegram Mini App
    console.log('=== Telegram Mini App Debug ===');
    console.log('Current URL:', window.location.href);
    console.log('URL params:', new URLSearchParams(window.location.search).toString());
    console.log('URL hash:', window.location.hash);
    console.log('User Agent:', navigator.userAgent);
    
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      console.log('✅ Telegram WebApp initialized');
      
      // Store Telegram data for Flutter
      window.telegramWebAppData = {
        initData: window.Telegram.WebApp.initData,
        initDataUnsafe: window.Telegram.WebApp.initDataUnsafe,
        version: window.Telegram.WebApp.version,
        platform: window.Telegram.WebApp.platform,
        isExpanded: window.Telegram.WebApp.isExpanded,
        viewportHeight: window.Telegram.WebApp.viewportHeight,
        viewportStableHeight: window.Telegram.WebApp.viewportStableHeight
      };
      
      console.log('✅ Telegram WebApp data stored:', window.telegramWebAppData);
      console.log('✅ User from initDataUnsafe:', window.Telegram.WebApp.initDataUnsafe?.user);
    } else {
      console.log('⚠️ Telegram WebApp SDK not loaded - running in regular browser');
    }
    
    // Force cache refresh for Telegram Mini App
    if (window.performance && window.performance.navigation.type === 1) {
      console.log('🔄 Page reloaded from cache, forcing refresh...');
      location.reload(true);
    }
  </script>
  <script src="flutter_bootstrap.js?version=20260729" async></script>
</body>
</html>
